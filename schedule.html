<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>情熱MAP [予定確認用] v1.14</title>
  <link rel="apple-touch-icon" href="icon_schedule.png">
  <link rel="icon" href="icon_schedule.png">
  <link rel="manifest" href="manifest_schedule.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="schedule.css">
</head>

<body>

  <div id="loginScreen"
    style="display:none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1a1a1a; z-index: 10000; flex-direction: column; justify-content: center; align-items: center;">
    <div
      style="background: #222; padding: 30px; border-radius: 8px; width: 80%; max-width: 320px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">
      <h2 style="color:#4CAF50; margin-top: 0;">情熱MAP</h2>
      <div id="loginError" style="color:red; margin-bottom:10px; font-size:14px;"></div>

      <input type="text" id="loginId" placeholder="スタッフID"
        style="width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #555; border-radius: 4px; box-sizing: border-box; font-size: 16px; background:#333; color:white;">
      <input type="password" id="loginPw" placeholder="パスワード"
        style="width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #555; border-radius: 4px; box-sizing: border-box; font-size: 16px; background:#333; color:white;">
      <button class="login-btn" onclick="executeLogin()"
        style="width: 100%; padding: 14px; background: #4CAF50; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer;">ログイン</button>
    </div>
  </div>

  <div class="control-panel">
    <div class="control-panel-buttons" style="display:flex; align-items:center;">
      <div class="legend">
        <div class="leg-item">
          <div class="leg-color" style="background:#4CAF50;"></div>平和
        </div>
        <div class="leg-item">
          <div class="leg-color" style="background:#FFEB3B;"></div>予定有
        </div>
        <div class="leg-item">
          <div class="leg-color" style="background:#F44336;"></div>問題/遅延
        </div>
        <div class="leg-item">
          <div class="leg-color" style="background:#FF9800;"></div>収穫中
        </div>
        <div class="leg-item">
          <div class="leg-color" style="background:#777777;"></div>対象外
        </div>
      </div>
      <button id="btnTyphoon" onclick="openTyphoonModal()"
        style="display:none; margin-right:10px; background:#ffebee; color:#d32f2f; border:2px solid #d32f2f; padding:8px 12px; border-radius:5px; font-weight:bold; font-size:14px; align-items:center; cursor:pointer;">🌀
        台風</button>
      <button id="btnWeather" onclick="openWeatherModal()"
        style="margin-right:10px; background:white; color:#ff9800; border:1px solid #ccc; padding:8px 12px; border-radius:5px; font-weight:bold; font-size:14px; display:flex; align-items:center; cursor:pointer;">☁️</button>
      <button id="btnSatellite" onclick="openSatelliteModal()"
        style="margin-right:10px; background:white; color:#1565C0; border:1px solid #90CAF9; padding:8px 12px; border-radius:5px; font-weight:bold; font-size:14px; display:flex; align-items:center; cursor:pointer;" title="気象衛星ひまわり">🛰️</button>
      <button class="btn-reload" onclick="location.reload()" style="margin-right:10px;">🔄 更新</button>
      <select id="trackingMode" class="desktop-only"
        style="margin-right:10px; padding:8px; border-radius:5px; background:#555; color:white; border:1px solid #777; font-weight:bold; font-size:11px;">
        <option value="path">線(Path)</option>
        <option value="trip">アニメ(Trip)</option>
      </select>
      <input type="date" id="trackingDate" class="desktop-only" style="margin-right:10px; padding:8px; border-radius:5px; border:1px solid #ccc; font-weight:bold; font-size:11px;">
      <button class="btn-primary desktop-only" onclick="loadTrackingData()"
        style="background:#4CAF50; margin-right:10px;">🏃‍♂️ 表示</button>
      <div class="desktop-only" style="position: relative; display: inline-block; margin-right: 10px;">
        <button class="btn-primary" onclick="toggleCultivationMenu()" style="background:#8BC34A;">🌱 栽培計画 ▼</button>
        <div id="cultivationMenu"
          style="display: none; position: absolute; top: 100%; left: 0; background: #fff; border: 1px solid #ccc; border-radius: 4px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); z-index: 1000; min-width: 170px; flex-direction: column;">
          <button onclick="openCultivationPlanModal(); toggleCultivationMenu()"
            style="padding: 10px; background: none; border: none; text-align: left; cursor: pointer; width: 100%; border-bottom: 1px solid #eee; font-size: 13px; font-weight: bold; color: #333;">📝
            栽培計画を立てる</button>
          <button onclick="startFieldCultivationMode(); toggleCultivationMenu()"
            style="padding: 10px; background: none; border: none; text-align: left; cursor: pointer; width: 100%; border-bottom: 1px solid #eee; font-size: 13px; font-weight: bold; color: #333;">📍
            圃場から栽培計画</button>
          <button onclick="openCroptypeRegistrationModal(); toggleCultivationMenu()"
            style="padding: 10px; background: none; border: none; text-align: left; cursor: pointer; width: 100%; font-size: 13px; font-weight: bold; color: #333;">🏷️
            品種作型を登録する</button>
        </div>
      </div>
      <button class="btn-primary desktop-only" onclick="openScheduleTable()" style="margin-right:10px;">📋 作業一覧</button>
      <button class="btn-primary desktop-only" onclick="openCropMarketModal()" style="background:#E65100; margin-right:10px;">📈 市況情報</button>
      <button class="btn-primary desktop-only" onclick="openMyPage()" style="background:#7B1FA2; margin-right:10px;">👤 マイページ</button>
      <button class="btn-primary desktop-only" onclick="executeLogout()" style="background:#f44336;">🚪 ログアウト</button>
    </div>
  </div>

  <div id="deptFilterBar">
  </div>

  <div id="fieldCultivationModeBanner"
    style="display:none; position:fixed; top:20px; left:50%; transform:translateX(-50%); background:rgba(0,150,136,0.95); color:white; padding:15px; border-radius:12px; z-index:5000; align-items:center; gap:10px; width: 90%; max-width: 350px; box-shadow:0 4px 15px rgba(0,0,0,0.3); flex-direction: column; justify-content: center; font-weight:bold; font-size:14px; text-align:center;">
    <div id="fieldCultivationModeMessage">🗺️ 栽培計画を立てる圃場をタップしてください</div>
    <button onclick="cancelFieldCultivationMode()"
      style="width:100%; margin-top:10px; background:#666; color:white; border:none; padding:10px; border-radius:6px; font-weight:bold; font-size:14px; cursor: pointer;">キャンセル</button>
  </div>

  <div id="map"></div>

  <div id="scheduleModal">
    <div class="modal-content">
      <div class="modal-header">
        <span>📋 <span id="tableDeptName">すべて</span>の作業一覧</span>
        <span style="cursor:pointer; font-size:24px;"
          onclick="document.getElementById('scheduleModal').style.display='none'">×</span>
      </div>
      <div class="modal-body">
        <table id="scheduleTable">
          <thead>
            <tr>
              <th>作業名</th>
              <th>部署</th>
              <th>品目</th>
              <th>圃場/看板名</th>
              <th>予定日</th>
              <th>期限日</th>
              <th>時間(h)</th>
              <th>適合者</th>
            </tr>
          </thead>
          <tbody id="scheduleTableBody">
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="weatherModal"
    style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 10000; flex-direction: column; justify-content: center; align-items: center;">
    <div
      style="background: #fff; color: #333; padding: 20px; border-radius: 8px; width: 85%; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); max-height: 80vh; display: flex; flex-direction: column;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h3 style="margin: 0; color: #2196F3;">⛅ 週間天気予報</h3>
        <span style="cursor: pointer; font-size: 24px; line-height: 1; color: #999;"
          onclick="document.getElementById('weatherModal').style.display='none'">×</span>
      </div>
      <div id="weatherContent" style="overflow-y: auto; flex: 1;">
        <div style="text-align:center; padding:20px;">読み込み中...</div>
      </div>
    </div>
  </div>

  <div id="typhoonModal"
    style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 10000; flex-direction: column; justify-content: center; align-items: center;">
    <div
      style="background: #fff; color: #333; padding: 20px; border-radius: 8px; width: 85%; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); max-height: 80vh; display: flex; flex-direction: column;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h3 style="margin: 0; color: #d32f2f;">🌀 台風情報</h3>
        <span style="cursor: pointer; font-size: 24px; line-height: 1; color: #999;"
          onclick="document.getElementById('typhoonModal').style.display='none'">×</span>
      </div>
      <div id="typhoonContent" style="overflow-y: auto; flex: 1;">
        <div style="text-align:center; padding:20px;">読み込み中...</div>
      </div>
    </div>
  </div>

  <!-- 作物別市況情報 -->
  <div id="cropMarketModal"
    style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 10000; flex-direction: column; justify-content: center; align-items: center;">
    <div
      style="background: #fff; color: #333; padding: 20px; border-radius: 8px; width: 90%; max-width: 420px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); max-height: 85vh; display: flex; flex-direction: column; box-sizing: border-box;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h3 style="margin: 0; color: #E65100;">📈 作物別市況情報</h3>
        <span style="cursor: pointer; font-size: 24px; line-height: 1; color: #999;"
          onclick="document.getElementById('cropMarketModal').style.display='none'">×</span>
      </div>
      <div style="font-size:12px; color:#666; margin-bottom:12px; line-height:1.5;">
        作物を選ぶと、その品目の市況・卸売価格を確認できます。
      </div>
      <div style="display:flex; gap:6px; margin-bottom:12px;">
        <input type="text" id="cropMarketSearchInput" placeholder="作物名を入力（例: キャベツ）"
          style="flex:1; padding:10px; border:1px solid #ccc; border-radius:6px; font-size:15px; box-sizing:border-box;"
          onkeydown="if(event.key==='Enter'){ openCropMarketForName(document.getElementById('cropMarketSearchInput').value); }">
        <button type="button" onclick="openCropMarketForName(document.getElementById('cropMarketSearchInput').value)"
          style="background:#E65100; color:#fff; border:none; border-radius:6px; padding:10px 14px; font-weight:bold; cursor:pointer; white-space:nowrap;">検索</button>
      </div>
      <div id="cropMarketCropList" style="overflow-y:auto; flex:1; margin-bottom:12px;"></div>
      <div id="cropMarketExtraLinks"></div>
      <div style="border-top:1px solid #eee; padding-top:12px; display:flex; flex-direction:column; gap:8px;">
        <div style="font-size:11px; color:#888; font-weight:bold;">公式サイト（全体）</div>
        <button type="button" onclick="window.open('https://www.maff.go.jp/j/tokei/syohi/oroshi_kakaku/seika.html','_blank')"
          style="background:#E3F2FD; color:#1565C0; border:1px solid #90CAF9; padding:10px; border-radius:6px; font-weight:bold; cursor:pointer; text-align:left;">📊 農水省 日別情報グラフ（青果物）</button>
        <button type="button" onclick="window.open('https://www.maff.go.jp/j/tokei/syohi/shunbetu/index.html','_blank')"
          style="background:#E8F5E9; color:#2E7D32; border:1px solid #A5D6A7; padding:10px; border-radius:6px; font-weight:bold; cursor:pointer; text-align:left;">📋 農水省 旬別結果</button>
        <button type="button" onclick="window.open('https://vegetan.alic.go.jp/','_blank')"
          style="background:#FFF3E0; color:#E65100; border:1px solid #FFCC80; padding:10px; border-radius:6px; font-weight:bold; cursor:pointer; text-align:left;">🥬 ベジ探（ALIC）</button>
      </div>
    </div>
  </div>

  <!-- Cultivation Plan Modal -->

  <div id="cultivationModalContainer"></div>

  <!-- モバイル用下部ナビゲーション -->
  <div class="mobile-bottom-bar">
    <button onclick="openScheduleTable()">
      <div style="font-size:20px;">📋</div>
      <div style="font-weight:bold;">作業一覧</div>
    </button>
    <button onclick="openCropMarketModal()">
      <div style="font-size:20px;">📈</div>
      <div style="font-weight:bold;">市況情報</div>
    </button>
    <button onclick="document.getElementById('mobileCultivationMenu').style.display='flex'">
      <div style="font-size:20px;">🌱</div>
      <div style="font-weight:bold;">栽培計画</div>
    </button>
    <button onclick="document.getElementById('mobileTrackingMenu').style.display='flex'">
      <div style="font-size:20px;">🏃‍♂️</div>
      <div style="font-weight:bold;">軌跡表示</div>
    </button>
    <button onclick="executeLogout()">
      <div style="font-size:20px;">🚪</div>
      <div style="font-weight:bold;">ログアウト</div>
    </button>
  </div>

  <!-- モバイル用アクションシート: 栽培計画 -->
  <div id="mobileCultivationMenu" class="mobile-action-sheet" style="display:none;" onclick="this.style.display='none'">
    <div class="action-sheet-content" onclick="event.stopPropagation()">
      <button
        onclick="openCultivationPlanModal(); document.getElementById('mobileCultivationMenu').style.display='none'">📝
        栽培計画を立てる</button>
      <button
        onclick="startFieldCultivationMode(); document.getElementById('mobileCultivationMenu').style.display='none'">📍
        圃場から栽培計画</button>
      <button
        onclick="openCroptypeRegistrationModal(); document.getElementById('mobileCultivationMenu').style.display='none'">🏷️
        品種作型を登録する</button>
      <button class="cancel-btn"
        onclick="document.getElementById('mobileCultivationMenu').style.display='none'">キャンセル</button>
    </div>
  </div>

  <!-- モバイル用アクションシート: 軌跡表示 -->
  <div id="mobileTrackingMenu" class="mobile-action-sheet" style="display:none;" onclick="this.style.display='none'">
    <div class="action-sheet-content" onclick="event.stopPropagation()">
      <div style="padding: 15px; font-weight: bold; border-bottom: 1px solid #eee; text-align: center; color: #333;">
        軌跡表示モード</div>
      <div style="padding: 15px;">
        <select id="trackingModeMobile"
          style="width:100%; padding: 10px; font-size:16px; border:1px solid #ccc; border-radius:5px;">
          <option value="path">線 (Path)</option>
          <option value="trip">アニメ (Trip)</option>
        </select>
        <input type="date" id="trackingDateMobile" style="width:100%; padding: 10px; font-size:16px; border:1px solid #ccc; border-radius:5px; margin-top:10px;">
      </div>
      <button
        onclick="document.getElementById('trackingMode').value = document.getElementById('trackingModeMobile').value; document.getElementById('trackingDate').value = document.getElementById('trackingDateMobile').value; loadTrackingData(); document.getElementById('mobileTrackingMenu').style.display='none'">🏃‍♂️
        表示する</button>
      <button class="cancel-btn"
        onclick="document.getElementById('mobileTrackingMenu').style.display='none'">キャンセル</button>
    </div>
  </div>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCjTdBJUXSQOk3fxGk0ESoKErCwdPg0MQ8&libraries=geometry&language=ja"></script>
  <script src="https://unpkg.com/deck.gl@^8.8.0/dist.min.js"></script>
  <script src="https://unpkg.com/@deck.gl/geo-layers@^8.8.0/dist.min.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>

  <script>
    // 栽培計画モーダルのHTMLを動的読み込み
    fetch('cultivation_modal.html?v=' + new Date().getTime())
      .then(res => res.text())
      .then(html => {
        document.getElementById('cultivationModalContainer').innerHTML = html;
      });

    // キャッシュバスターを付与して動的に読み込む
    const script = document.createElement('script');
    script.src = "schedule.js?v=" + new Date().getTime();
    script.onload = () => {
      const scriptTrack = document.createElement('script');
      scriptTrack.src = "tracking.js?v=1784615000001";
      scriptTrack.onload = () => {
        const scriptCul = document.createElement('script');
        scriptCul.src = "cultivation.js?v=" + new Date().getTime();
        document.body.appendChild(scriptCul);
      };
      document.body.appendChild(scriptTrack);
    };
    document.body.appendChild(script);
  </script>

  <!-- Radar Modal -->
  <div id="radarModal"
    style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 10001; flex-direction: column; justify-content: center; align-items: center;">
    <div
      style="background: #fff; width: 95%; height: 90vh; border-radius: 8px; display: flex; flex-direction: column; overflow: hidden;">
      <div
        style="display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: #2196F3; color: white;">
        <h3 style="margin: 0; font-size: 18px;">🌧️ 雨雲レーダー</h3>
        <span style="cursor: pointer; font-size: 28px; line-height: 1;" onclick="closeRadarModal()">×</span>
      </div>
      <div id="radarContent" style="flex: 1; position: relative; -webkit-overflow-scrolling: touch;"></div>
    </div>
  </div>

  <!-- 気象衛星ひまわり -->
  <div id="satelliteModal"
    style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 10001; flex-direction: column; justify-content: center; align-items: center;">
    <div
      style="background: #111; width: 96%; height: 92vh; border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.5);">
      <div
        style="display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: #0D47A1; color: white; gap: 8px; flex-wrap: wrap;">
        <h3 style="margin: 0; font-size: 16px; white-space: nowrap;">🛰️ 気象衛星ひまわり</h3>
        <div style="display:flex; gap:6px; flex-wrap:wrap; align-items:center;">
          <button type="button" onclick="setSatelliteBand('b13')" id="satBand_b13"
            style="background:#1565C0; color:#fff; border:1px solid #90CAF9; padding:6px 10px; border-radius:4px; font-size:12px; font-weight:bold; cursor:pointer;">赤外</button>
          <button type="button" onclick="setSatelliteBand('b03')" id="satBand_b03"
            style="background:#333; color:#fff; border:1px solid #666; padding:6px 10px; border-radius:4px; font-size:12px; font-weight:bold; cursor:pointer;">可視</button>
          <button type="button" onclick="setSatelliteBand('dnc')" id="satBand_dnc"
            style="background:#333; color:#fff; border:1px solid #666; padding:6px 10px; border-radius:4px; font-size:12px; font-weight:bold; cursor:pointer;">カラー</button>
          <button type="button" onclick="refreshSatelliteImage()"
            style="background:#4CAF50; color:#fff; border:none; padding:6px 10px; border-radius:4px; font-size:12px; font-weight:bold; cursor:pointer;">🔄 最新</button>
          <span style="cursor: pointer; font-size: 28px; line-height: 1; padding-left:4px;" onclick="closeSatelliteModal()">×</span>
        </div>
      </div>
      <div style="padding:6px 12px; background:#1a237e; color:#bbdefb; font-size:12px; display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap;">
        <span id="satelliteTimeLabel">観測時刻を取得中...</span>
        <a href="https://www.data.jma.go.jp/mscweb/data/himawari/sat_img.php?area=jpn" target="_blank" rel="noopener"
          style="color:#90CAF9; font-weight:bold;">気象庁MSCで開く ↗</a>
      </div>
      <div id="satelliteContent"
        style="flex: 1; position: relative; background:#000; display:flex; align-items:center; justify-content:center; overflow:auto; -webkit-overflow-scrolling: touch;">
        <img id="satelliteImage" alt="ひまわり衛星画像" style="max-width:100%; max-height:100%; object-fit:contain; display:none;">
        <div id="satelliteLoading" style="color:#90CAF9; font-weight:bold; padding:20px;">読み込み中...</div>
      </div>
      <div style="padding:8px 12px; background:#222; color:#aaa; font-size:11px; text-align:center;">
        出典: 気象庁 気象衛星センター（ひまわり）／約10分間隔で更新
      </div>
    </div>
  </div>


  <button id="btnTracking" onclick="toggleTracking()"
    style="position: fixed; bottom: 302px; right: 10px; width: 50px; height: 50px; background: white; color: #4CAF50; border: none; border-radius: 50%; font-weight: bold; font-size: 24px; box-shadow: 0 3px 8px rgba(0,0,0,0.3); z-index: 2000; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; padding: 0; transition: all 0.3s ease;">
    🏃‍♂️
  </button>
</body>

</html>
