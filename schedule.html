<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>情熱MAP [予定確認用]</title>
    <link rel="apple-touch-icon" href="icon_schedule.png">
    <link rel="icon" href="icon_schedule.png">
    <link rel="manifest" href="manifest_schedule.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="schedule.css">
  </head>
  <body>

    <div class="control-panel">
      <div style="font-weight:bold; font-size:16px;">🗺️ 予定確認MAP</div>
      <div class="control-panel-buttons" style="display:flex; align-items:center;">
        <div class="legend">
          <div class="leg-item"><div class="leg-color" style="background:#4CAF50;"></div>平和</div>
          <div class="leg-item"><div class="leg-color" style="background:#FFEB3B;"></div>予定有</div>
          <div class="leg-item"><div class="leg-color" style="background:#F44336;"></div>問題/遅延</div>
          <div class="leg-item"><div class="leg-color" style="background:#FF9800;"></div>収穫中</div>
          <div class="leg-item"><div class="leg-color" style="background:#777777;"></div>対象外</div>
        </div>
        <button id="btnTyphoon" onclick="openTyphoonModal()" style="display:none; margin-right:10px; background:#ffebee; color:#d32f2f; border:2px solid #d32f2f; padding:8px 12px; border-radius:5px; font-weight:bold; font-size:14px; align-items:center; cursor:pointer;">🌀 台風</button>
        <button id="btnWeather" onclick="openWeatherModal()" style="margin-right:10px; background:white; color:#ff9800; border:1px solid #ccc; padding:8px 12px; border-radius:5px; font-weight:bold; font-size:14px; display:flex; align-items:center; cursor:pointer;">☁️</button>
        <button class="btn-reload" onclick="location.reload()" style="margin-right:10px;">🔄 更新</button>
        <select id="trackingMode" style="margin-right:10px; padding:8px; border-radius:5px; background:#555; color:white; border:1px solid #777; font-weight:bold; font-size:11px;">
            <option value="path">線(Path)</option>
            <option value="trip">アニメ(Trip)</option>
        </select>
        <button class="btn-primary" onclick="loadTrackingData()" style="background:#4CAF50; margin-right:10px;">🏃‍♂️ 表示</button>
        <button class="btn-primary" onclick="openCultivationPlanModal()" style="background:#8BC34A; margin-right:10px;">🌱 栽培計画</button>
        <button class="btn-primary" onclick="openScheduleTable()">📋 作業一覧</button>
      </div>
    </div>
    
    <div id="deptFilterBar">
       </div>

    <div id="map"></div>

    <div id="scheduleModal">
      <div class="modal-content">
        <div class="modal-header">
          <span>📋 <span id="tableDeptName">すべて</span>の作業一覧</span>
          <span style="cursor:pointer; font-size:24px;" onclick="document.getElementById('scheduleModal').style.display='none'">×</span>
        </div>
        <div class="modal-body">
          <table id="scheduleTable">
            <thead>
              <tr>
                <th>作業名</th>
                <th>部署</th>
                <th>品目</th>
                <th>圃場/看板名</th>
                <th>予定日</th>
                <th>期限日</th>
                <th>時間(h)</th>
                <th>適合者</th>
              </tr>
            </thead>
            <tbody id="scheduleTableBody">
              </tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="weatherModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 10000; justify-content: center; align-items: center;">
      <div style="background: #fff; color: #333; padding: 20px; border-radius: 8px; width: 85%; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); max-height: 80vh; display: flex; flex-direction: column;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
          <h3 style="margin: 0; color: #2196F3;">⛅ 週間天気予報</h3>
          <span style="cursor: pointer; font-size: 24px; line-height: 1; color: #999;" onclick="document.getElementById('weatherModal').style.display='none'">×</span>
        </div>
        <div id="weatherContent" style="overflow-y: auto; flex: 1;">
          <div style="text-align:center; padding:20px;">読み込み中...</div>
        </div>
      </div>
    </div>

    <div id="typhoonModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 10000; justify-content: center; align-items: center;">
      <div style="background: #fff; color: #333; padding: 20px; border-radius: 8px; width: 85%; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); max-height: 80vh; display: flex; flex-direction: column;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
          <h3 style="margin: 0; color: #d32f2f;">🌀 台風情報</h3>
          <span style="cursor: pointer; font-size: 24px; line-height: 1; color: #999;" onclick="document.getElementById('typhoonModal').style.display='none'">×</span>
        </div>
        <div id="typhoonContent" style="overflow-y: auto; flex: 1;">
          <div style="text-align:center; padding:20px;">読み込み中...</div>
        </div>
      </div>
    </div>

    <!-- Cultivation Plan Modal -->
    
    <div id=" cultivationModalContainer></div>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCjTdBJUXSQOk3fxGk0ESoKErCwdPg0MQ8&libraries=geometry&language=ja"></script>

    <script src="https://unpkg.com/deck.gl@^8.8.0/dist.min.js"></script>

    <script>
      // 栽培計画モーダルのHTMLを動的読み込み
      fetch('cultivation_modal.html?v=' + new Date().getTime())
        .then(res => res.text())
        .then(html => {
            document.getElementById('cultivationModalContainer').innerHTML = html;
        });

      // キャッシュバスターを付与して動的に読み込む
      const script = document.createElement('script');
      script.src = "schedule.js?v=" + new Date().getTime();
      script.onload = () => {
          // schedule.js読み込み後にcultivation.jsを読み込む
          const scriptCul = document.createElement('script');
          scriptCul.src = "cultivation.js?v=" + new Date().getTime();
          document.body.appendChild(scriptCul);
      };
      document.body.appendChild(script);
    </script>
</body>
</html>
