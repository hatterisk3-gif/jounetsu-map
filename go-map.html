<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Googleマップで開く - 情熱MAP</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: "Hiragino Sans", "Yu Gothic", -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f5f2ee;
      color: #2c1e16;
    }
    .wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 16px;
      padding: 24px 20px;
      box-shadow: 0 8px 28px rgba(44, 30, 22, 0.12);
      text-align: center;
    }
    .icon {
      font-size: 40px;
      line-height: 1;
      margin-bottom: 10px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 19px;
      font-weight: 800;
      color: #3e2723;
    }
    .sub {
      margin: 0 0 18px;
      font-size: 13px;
      line-height: 1.5;
      color: #6d4c41;
    }
    .coord-box {
      background: #faf7f4;
      border: 1px solid #e6ddd5;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 700;
      color: #4e342e;
      margin-bottom: 18px;
      word-break: break-all;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 15px 14px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
      margin-bottom: 10px;
      text-align: center;
    }
    .btn-primary {
      background: #1a73e8;
      color: #fff;
      box-shadow: 0 3px 10px rgba(26, 115, 232, 0.28);
    }
    .btn-secondary {
      background: #eef3fb;
      color: #1557b0;
      font-size: 14px;
      padding: 12px 14px;
    }
    .btn-neutral {
      background: #f2ede8;
      color: #4e342e;
      font-size: 14px;
      padding: 12px 14px;
    }
    .hint {
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #fff8e1;
      border: 1px solid #ffe082;
      font-size: 12px;
      line-height: 1.55;
      color: #6d4c41;
      text-align: left;
    }
    .error-msg {
      color: #c62828;
      font-weight: 700;
      font-size: 14px;
      padding: 12px 0;
    }
    .toast {
      margin-top: 8px;
      font-size: 12px;
      font-weight: 700;
      color: #2e7d32;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="icon">📍</div>
      <h1 id="pageTitle">Googleマップを開いています</h1>
      <p class="sub" id="pageSub">自動で開かない場合は、下のボタンを押してください。</p>
      <div class="coord-box" id="coordBox">座標を確認中...</div>

      <div id="actionArea">
        <a id="btnApp" class="btn btn-primary" href="#">🗺️ Googleマップアプリで開く</a>
        <a id="btnGeo" class="btn btn-secondary" href="#" style="display:none;">📱 地図アプリ選択で開く</a>
        <a id="btnApple" class="btn btn-neutral" href="#" style="display:none;">🍎 Appleマップで開く</a>
        <a id="btnWeb" class="btn btn-neutral" href="#" target="_blank" rel="noopener">🌐 ブラウザ版Googleマップで開く</a>
        <button id="btnCopy" type="button" class="btn btn-neutral">📋 座標をコピー</button>
      </div>

      <div class="toast" id="copyToast"></div>

      <div class="hint" id="lineHint" style="display:none;">
        LINE内ブラウザでは自動起動が制限されることがあります。<br>
        ボタンを押しても開かない場合は、画面隅のメニュー（︙ / …）から <strong>「他のアプリで開く」</strong>（Safari / Chrome）をお試しください。
      </div>
    </div>
  </div>

  <script>
    (function () {
      function parseCoords() {
        var params = new URLSearchParams(window.location.search || '');
        var lat = parseFloat(params.get('lat'));
        var lng = parseFloat(params.get('lng'));
        if ((isNaN(lat) || isNaN(lng)) && params.get('q')) {
          var parts = String(params.get('q')).split(',');
          if (parts.length >= 2) {
            lat = parseFloat(parts[0]);
            lng = parseFloat(parts[1]);
          }
        }
        if (isNaN(lat) || isNaN(lng) || lat < -90 || lat > 90 || lng < -180 || lng > 180) {
          return null;
        }
        return {
          lat: lat.toFixed(6),
          lng: lng.toFixed(6),
          name: (params.get('name') || '').trim()
        };
      }

      var data = parseCoords();
      var coordBox = document.getElementById('coordBox');
      var actionArea = document.getElementById('actionArea');
      var pageTitle = document.getElementById('pageTitle');
      var pageSub = document.getElementById('pageSub');

      if (!data) {
        pageTitle.textContent = '座標が読み取れませんでした';
        pageSub.textContent = 'URLの座標パラメータが不足しているか形式が不正です。';
        coordBox.className = 'error-msg';
        coordBox.textContent = '有効な緯度・経度が指定されていません。';
        actionArea.style.display = 'none';
        return;
      }

      var coordStr = data.lat + ',' + data.lng;
      if (data.name) {
        pageTitle.textContent = data.name;
      }
      coordBox.textContent = '座標: ' + coordStr;

      var webUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(coordStr);
      var ua = navigator.userAgent || '';
      var isIOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
      var isAndroid = /Android/i.test(ua);
      var isLine = /Line\//i.test(ua);

      var btnApp = document.getElementById('btnApp');
      var btnGeo = document.getElementById('btnGeo');
      var btnApple = document.getElementById('btnApple');
      var btnWeb = document.getElementById('btnWeb');
      var btnCopy = document.getElementById('btnCopy');
      var copyToast = document.getElementById('copyToast');
      var lineHint = document.getElementById('lineHint');

      btnWeb.href = webUrl;
      if (isLine) {
        lineHint.style.display = 'block';
      }

      var primaryAppUrl = webUrl;

      if (isIOS) {
        primaryAppUrl = 'comgooglemaps://?q=' + coordStr + '&center=' + coordStr + '&zoom=17';
        btnApp.href = primaryAppUrl;
        btnApple.href = 'https://maps.apple.com/?q=' + encodeURIComponent(coordStr);
        btnApple.style.display = 'block';
      } else if (isAndroid) {
        primaryAppUrl = 'intent://maps.google.com/maps?q=' + coordStr
          + '#Intent;scheme=https;package=com.google.android.apps.maps;S.browser_fallback_url='
          + encodeURIComponent(webUrl) + ';end';
        btnApp.href = primaryAppUrl;
        btnGeo.href = 'geo:' + coordStr + '?q=' + coordStr;
        btnGeo.style.display = 'block';
      } else {
        btnApp.href = webUrl;
      }

      btnCopy.addEventListener('click', function () {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(coordStr).then(function () {
            copyToast.textContent = '📋 座標（' + coordStr + '）をコピーしました';
          }).catch(function () {
            window.prompt('以下をコピーしてください', coordStr);
          });
        } else {
          window.prompt('以下をコピーしてください', coordStr);
        }
      });

      // 読み込み時に自動でアプリ起動を試みる
      setTimeout(function () {
        try {
          window.location.href = primaryAppUrl;
        } catch (e) {}
      }, 150);
    })();
  </script>
</body>
</html>
