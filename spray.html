<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>情熱MAP 防除アプリ v1.0</title>
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">
  <script src="exit-guard.js?v=1786240000001"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; font-family: sans-serif; background: #102018; }
    #map { position: absolute; inset: 0; z-index: 1; }
    #loginScreen {
      position: fixed; inset: 0; z-index: 40000; display: flex; align-items: center; justify-content: center;
      background: #102018;
    }
    .login-box {
      width: 88%; max-width: 360px; background: #fff; border-radius: 12px; padding: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,.35); text-align: center;
    }
    .login-input {
      width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px;
    }
    .login-btn {
      width: 100%; padding: 12px; background: #2E7D32; color: #fff; border: none; border-radius: 8px;
      font-size: 16px; font-weight: bold; cursor: pointer;
    }
    .sheet {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 2000;
      background: #fff; border-radius: 16px 16px 0 0;
      box-shadow: 0 -6px 24px rgba(0,0,0,.22);
      max-height: 72vh; display: flex; flex-direction: column;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .sheet-handle { width: 40px; height: 4px; border-radius: 2px; background: #ddd; margin: 8px auto 4px; }
    .sheet-head {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      padding: 4px 14px 8px;
    }
    .sheet-head h2 { margin: 0; font-size: 16px; color: #1B5E20; }
    .sheet-body { overflow-y: auto; padding: 0 14px 14px; flex: 1; }
    .fab {
      position: fixed; z-index: 1900; width: 48px; height: 48px; border: none; border-radius: 50%;
      background: #fff; color: #1565C0; font-size: 22px; box-shadow: 0 3px 8px rgba(0,0,0,.3); cursor: pointer;
    }
    #btnCurrentLocation { bottom: calc(12px + env(safe-area-inset-bottom)); right: 12px; }
    #setupCard[style*="flex"] ~ #btnCurrentLocation,
    body.setup-open #btnCurrentLocation { bottom: 280px; }
    #btnHome { top: 12px; left: 12px; width: auto; height: 36px; border-radius: 18px; font-size: 13px; font-weight: bold; padding: 0 12px; color: #333; }
    label.field { display: block; font-size: 11px; font-weight: bold; color: #555; margin: 10px 0 4px; }
    .inp, .sel {
      width: 100%; padding: 9px 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; background: #fff;
    }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .chip-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      border: 1px solid #A5D6A7; background: #fff; color: #1B5E20; border-radius: 16px;
      padding: 5px 10px; font-size: 12px; font-weight: bold; cursor: pointer;
    }
    .chip.on { background: #2E7D32; color: #fff; border-color: #1B5E20; }
    .field-item {
      display: flex; align-items: center; gap: 8px; background: #f7faf7; border: 1px solid #e0e0e0;
      border-radius: 8px; padding: 8px; margin-bottom: 6px;
    }
    .field-item .ord { width: 22px; text-align: center; font-weight: bold; color: #2E7D32; }
    .field-item .name { flex: 1; min-width: 0; font-size: 13px; font-weight: bold; }
    .field-item .meta { font-size: 11px; color: #666; }
    .ord-btn {
      width: 32px; height: 32px; border: 1px solid #ccc; background: #fff; border-radius: 6px;
      font-weight: bold; cursor: pointer;
    }
    .primary {
      width: 100%; padding: 14px; background: #2E7D32; color: #fff; border: none; border-radius: 10px;
      font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 3px 8px rgba(46,125,50,.3);
    }
    .secondary {
      width: 100%; padding: 12px; background: #fff; color: #1B5E20; border: 1px solid #81C784;
      border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer;
    }
    .ghost {
      background: none; border: none; color: #1565C0; font-weight: bold; font-size: 13px; cursor: pointer;
    }
    .chem-card {
      background: #FFF8E1; border: 1px solid #FFE082; border-radius: 8px; padding: 8px; margin-bottom: 8px;
    }
    .qty-box {
      background: #E8F5E9; border: 1px solid #A5D6A7; border-radius: 10px; padding: 12px; margin-bottom: 10px;
    }
    .qty-big { font-size: 28px; font-weight: bold; color: #1B5E20; line-height: 1.1; }
    .progress-bar { height: 8px; background: #eee; border-radius: 99px; overflow: hidden; margin: 6px 0 10px; }
    .progress-bar > div { height: 100%; background: #43A047; }
    .hint { font-size: 11px; color: #888; line-height: 1.4; }
    .search-hit {
      display: block; width: 100%; text-align: left; background: #fff; border: 1px solid #c8e6c9;
      border-radius: 6px; padding: 8px; margin-bottom: 4px; cursor: pointer;
    }
    #runCard { display: none; }
    #setupCard { display: flex; }
  </style>
</head>
<body>
  <div id="loginScreen">
    <div class="login-box">
      <h2 style="color:#2E7D32; margin-top:0;">情熱MAP 防除</h2>
      <div id="loginError" style="color:#c62828; margin-bottom:10px; font-size:13px;"></div>
      <input type="text" id="loginId" class="login-input" placeholder="スタッフID" autocomplete="username">
      <input type="password" id="loginPw" class="login-input" placeholder="パスワード" autocomplete="current-password">
      <button class="login-btn" onclick="executeLogin()">ログイン</button>
    </div>
  </div>

  <div id="map"></div>
  <button type="button" id="btnHome" class="fab" onclick="location.href='index2.html'">🏠 戻る</button>
  <button type="button" id="btnCurrentLocation" class="fab" title="現在地">📍</button>

  <div id="setupCard" class="sheet" data-exit-guard="true">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <h2>🧪 防除設定</h2>
      <button type="button" class="ghost" onclick="toggleSheet()">縮小</button>
    </div>
    <div class="sheet-body">
      <label class="field">拠点</label>
      <select id="sprayLocation" class="sel" onchange="onSprayLocationChange()"></select>

      <label class="field">圃場を選択（地図タップでも可）</label>
      <input type="search" id="fieldSearch" class="inp" placeholder="圃場名で絞り込み" oninput="renderFieldPicker()">
      <div id="fieldPicker" style="max-height:140px; overflow:auto; margin-top:6px;"></div>

      <label class="field">回る順番</label>
      <div id="orderList"></div>
      <div style="display:flex; gap:6px; margin-top:4px;">
        <button type="button" class="secondary" style="padding:8px; font-size:12px;" onclick="sortFieldsNorthToSouth()">北から順</button>
        <button type="button" class="secondary" style="padding:8px; font-size:12px;" onclick="clearSelectedFields()">選択クリア</button>
      </div>

      <div class="row2">
        <div>
          <label class="field">薬液量（L / 10a）</label>
          <input type="number" id="sprayVolumePer10a" class="inp" min="1" step="1" value="100">
        </div>
        <div>
          <label class="field">散布ロス（%）</label>
          <input type="number" id="sprayLossPct" class="inp" min="0" step="1" value="10">
        </div>
      </div>
      <div class="hint">ロスは薬液・薬剤の両方に上乗せします。例: 10aで100L、ロス10% → この圃場の必要薬液は面積換算×1.10</div>

      <label class="field">薬剤</label>
      <input type="search" id="chemSearch" class="inp" placeholder="農薬マスタから検索、または名前を入力" oninput="onChemSearchInput()">
      <div id="chemHits"></div>
      <div style="display:flex; gap:6px; margin-top:6px;">
        <input type="text" id="chemCustomName" class="inp" placeholder="マスタにない薬剤名">
        <input type="number" id="chemCustomDilution" class="inp" placeholder="倍率" min="1" style="width:90px;">
        <button type="button" class="secondary" style="width:auto; padding:8px 10px; white-space:nowrap;" onclick="addCustomChemical()">追加</button>
      </div>
      <div id="chemList" style="margin-top:8px;"></div>

      <div id="setupPreview" class="qty-box" style="display:none; margin-top:10px;"></div>
      <button type="button" class="primary" style="margin-top:12px;" onclick="startSprayRun()">この設定で防除を開始</button>
    </div>
  </div>

  <div id="runCard" class="sheet" data-exit-guard="true">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <h2 id="runTitle">防除中</h2>
      <button type="button" class="ghost" onclick="backToSetup()">設定に戻る</button>
    </div>
    <div class="sheet-body">
      <div id="runProgressLabel" class="hint"></div>
      <div class="progress-bar"><div id="runProgressBar" style="width:0%"></div></div>
      <div id="runFieldName" style="font-size:20px; font-weight:bold; color:#1B5E20;"></div>
      <div id="runFieldMeta" class="hint" style="margin-bottom:8px;"></div>
      <div class="qty-box">
        <div style="font-size:11px; color:#2E7D32; font-weight:bold;">この圃場の薬液量</div>
        <div id="runSolution" class="qty-big">—</div>
      </div>
      <div id="runChems"></div>
      <button type="button" class="primary" id="btnCompleteNext" onclick="completeCurrentField()">完了して次の畑</button>
      <button type="button" class="secondary" style="margin-top:8px;" onclick="skipCurrentField()">この圃場をスキップ</button>
    </div>
  </div>

  <script src="map-loading.js?v=1786243000000"></script>
  <script>
    window.initMap = function () { window._sprayNeedInit = true; };
  </script>
  <script src="spray.js?v=1787120000000"></script>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCjTdBJUXSQOk3fxGk0ESoKErCwdPg0MQ8&libraries=geometry&language=ja&v=weekly&callback=initMap" async defer></script>
</body>
</html>
