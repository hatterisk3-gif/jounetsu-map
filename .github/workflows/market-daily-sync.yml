name: Market Daily Sync

on:
  schedule:
    # 毎日 09:05 JST（00:05 UTC）に東京・大田／大阪・本場／大阪・東部の最新市況を同期
    - cron: '5 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Supabase market-sync Edge Function
        env:
          MARKET_SYNC_SECRET: ${{ secrets.MARKET_SYNC_SECRET }}
        run: |
          if [ -z "$MARKET_SYNC_SECRET" ]; then
            echo "::notice::MARKET_SYNC_SECRET が GitHub Actions Secrets に未設定のためスキップしました。設定すると毎日 09:05 JST に自動更新されます。"
            exit 0
          fi

          response_file=$(mktemp)
          http_code=$(curl -sS -w '%{http_code}' -o "$response_file" \
            -X POST "https://datskgzskdtfweqtcxcc.supabase.co/functions/v1/market-sync" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${MARKET_SYNC_SECRET}" \
            -d '{"action":"syncAll"}')

          cat "$response_file"
          echo ""

          if [ "$http_code" -ne 200 ]; then
            echo "::error::market-sync failed with HTTP $http_code"
            exit 1
          fi

          node -e "const fs = require('fs'); const res = JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); if (res.status !== 'success') { console.error(res); process.exit(1); }" "$response_file"
