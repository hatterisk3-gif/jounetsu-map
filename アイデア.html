<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>情熱MAP アイデアボード</title>
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f4f6f8; color: #263238; }
    header { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; background: #5e35b1; color: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.2); }
    header h1 { margin: 0; font-size: 18px; }
    .header-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .user-pill { background: rgba(255,255,255,.18); padding: 4px 10px; border-radius: 14px; font-size: 12px; font-weight: 700; }
    .back { color: #fff; text-decoration: none; border: 1px solid rgba(255,255,255,.55); border-radius: 7px; padding: 6px 10px; font-size: 12px; font-weight: 700; }
    main { width: min(860px, 100%); margin: 0 auto; padding: 14px 12px 48px; }
    .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
    .tab { border: 1px solid #d1c4e9; background: #fff; color: #5e35b1; border-radius: 10px; padding: 12px 8px; font-weight: 800; cursor: pointer; }
    .tab.active { background: #5e35b1; color: #fff; border-color: #4527a0; }
    .tab .n { display: inline-block; min-width: 18px; margin-left: 4px; background: rgba(0,0,0,.12); border-radius: 10px; padding: 0 6px; font-size: 11px; }
    .tab.active .n { background: rgba(255,255,255,.22); }
    .card-form { background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 14px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
    .form-title { font-weight: 800; color: #4527a0; margin-bottom: 10px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    label { display: block; font-size: 12px; font-weight: 700; color: #546e7a; margin-bottom: 4px; }
    input, select, textarea, button { font: inherit; }
    input, select, textarea { width: 100%; padding: 9px 10px; border: 1px solid #cfd8dc; border-radius: 8px; background: #fff; }
    input[readonly] { background: #f5f5f5; color: #546e7a; }
    textarea { min-height: 88px; resize: vertical; }
    .cat-row { display: flex; gap: 8px; align-items: stretch; }
    .cat-row input { flex: 1; min-height: 48px; font-size: 16px; padding: 12px 14px; }
    .cat-row .btn-sub { padding: 12px 16px; font-size: 14px; }
    #ideaCategory { min-height: 44px; font-size: 15px; }
    #ideaIssue { min-height: 72px; }
    .issue-tag { display: inline-block; margin-top: 8px; background: #fff3e0; color: #e65100; border: 1px solid #ffcc80; border-radius: 8px; padding: 6px 10px; font-size: 12px; font-weight: 700; line-height: 1.45; white-space: pre-wrap; }
    .btn { border: 0; border-radius: 8px; padding: 10px 14px; font-weight: 800; cursor: pointer; }
    .btn-primary { background: #5e35b1; color: #fff; width: 100%; margin-top: 10px; padding: 12px; }
    .btn-sub { background: #ede7f6; color: #4527a0; white-space: nowrap; }
    .btn-save { background: #6d4c41; color: #fff; }
    .status { font-size: 12px; color: #2e7d32; min-height: 18px; margin-top: 8px; font-weight: 700; }
    .status.err { color: #c62828; }
    .idea { background: #fff; border: 1px solid #e0e0e0; border-left: 5px solid #7e57c2; border-radius: 10px; padding: 12px; margin-bottom: 10px; cursor: pointer; }
    .idea.rejected { border-left-color: #8d6e63; background: #faf6f3; opacity: .96; }
    .idea.running { border-left-color: #2e7d32; }
    .idea.review { border-left-color: #ef6c00; }
    .idea-top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; flex-wrap: wrap; }
    .cat { font-size: 11px; font-weight: 800; color: #5e35b1; background: #ede7f6; border-radius: 10px; padding: 2px 8px; }
    .meta { font-size: 12px; color: #607d8b; margin-top: 4px; }
    .body { margin-top: 8px; white-space: pre-wrap; line-height: 1.55; font-size: 14px; }
    .progress { margin-top: 10px; display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
    .progress select { width: auto; min-width: 140px; }
    .reject-box { margin-top: 8px; background: #efebe9; border: 1px solid #d7ccc8; border-radius: 8px; padding: 8px; }
    .divider { margin: 22px 0 12px; text-align: center; color: #6d4c41; font-weight: 800; font-size: 13px; position: relative; }
    .divider:before, .divider:after { content: ""; position: absolute; top: 50%; width: 28%; height: 1px; background: #d7ccc8; }
    .divider:before { left: 0; }
    .divider:after { right: 0; }
    .empty { text-align: center; color: #90a4ae; padding: 28px 10px; }
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 50; align-items: center; justify-content: center; padding: 16px; }
    .overlay.show { display: flex; }
    .modal { background: #fff; width: min(560px, 100%); max-height: 88vh; overflow: auto; border-radius: 12px; padding: 16px; }
    .modal h3 { margin: 0 0 8px; color: #4527a0; }
    .hist, .memo { border: 1px solid #eee; border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; font-size: 13px; background: #fafafa; }
    .hist b, .memo b { color: #5e35b1; }
    @media (max-width: 640px) {
      .grid2 { grid-template-columns: 1fr; }
      .tab { font-size: 12px; padding: 10px 4px; }
      header h1 { font-size: 16px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>💡 アイデアボード</h1>
    <div class="header-right">
      <span class="user-pill" id="headerUser">未ログイン</span>
      <a class="back" href="index.html">🏠 ポータル</a>
    </div>
  </header>
  <main>
    <div class="tabs">
      <button type="button" class="tab active" id="tab_idea" onclick="ideaSwitchTab('idea')">💡 アイデア <span class="n" id="cnt_idea">0</span></button>
      <button type="button" class="tab" id="tab_review" onclick="ideaSwitchTab('review')">🗣️ 審議中 <span class="n" id="cnt_review">0</span></button>
      <button type="button" class="tab" id="tab_running" onclick="ideaSwitchTab('running')">🚀 運用中 <span class="n" id="cnt_running">0</span></button>
    </div>

    <div class="card-form">
      <div class="form-title">＋ アイデアを登録</div>
      <div class="grid2">
        <div>
          <label>アカウント名</label>
          <input id="ideaAuthor" readonly>
        </div>
        <div>
          <label>日付</label>
          <input type="date" id="ideaDate">
        </div>
      </div>
      <div style="margin-top:10px;">
        <label>カテゴリ</label>
        <select id="ideaCategory"></select>
      </div>
      <div style="margin-top:10px;">
        <label>カテゴリを手動追加</label>
        <div class="cat-row">
          <input id="ideaCategoryNew" placeholder="新しいカテゴリ名を入力">
          <button type="button" class="btn btn-sub" onclick="ideaAddCategory()">＋ 追加</button>
        </div>
      </div>
      <div style="margin-top:10px;">
        <label>課題</label>
        <textarea id="ideaIssue" placeholder="解決したい課題・困っていることを書いてください"></textarea>
      </div>
      <div style="margin-top:10px;">
        <label>内容</label>
        <textarea id="ideaContent" placeholder="アイデアの内容を書いてください"></textarea>
      </div>
      <button type="button" class="btn btn-primary" onclick="ideaSubmit()">💡 アイデアを登録</button>
      <div class="status" id="ideaFormStatus"></div>
    </div>

    <div id="ideaList"></div>
  </main>

  <div class="overlay" id="ideaOverlay" onclick="if(event.target===this) ideaCloseDetail()">
    <div class="modal" id="ideaModal"></div>
  </div>

  <script src="アイデア.js?v=1786458600000"></script>
</body>
</html>
