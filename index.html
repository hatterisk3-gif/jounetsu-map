<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>情熱MAP 総合案内所</title>
    
    <link rel="apple-touch-icon" href="/icon_index.png">
    <link rel="icon" href="/icon_index.png">
    <link rel="manifest" href="/manifest_portal.json">
    
    <style>
        body { font-family: sans-serif; background-color: #1a1a1a; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .container { text-align: center; background: #222; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); width: 85%; max-width: 400px; }
        h1 { color: #4CAF50; margin-bottom: 30px; font-size: 24px; }
        .btn { display: block; width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 8px; font-size: 16px; font-weight: bold; text-decoration: none; color: white; box-sizing: border-box; transition: opacity 0.2s; }
        .btn:active { opacity: 0.7; }
        .btn-worker { background-color: #4CAF50; }
        .btn-schedule { background-color: #2196F3; }
        .btn-admin { background-color: #d32f2f; }
        .hint { font-size: 13px; color: #aaa; margin-top: 25px; line-height: 1.6; text-align: left; background: #333; padding: 15px; border-radius: 8px;}
    </style>
</head>
<body>
    <div class="container">
        <h1>情熱MAP 総合案内所</h1>
        
        <a href="/worker.html" target="_blank" rel="noopener noreferrer" class="btn btn-worker">🌿 作業員用 MAP を開く</a>
        <a href="/schedule" target="_blank" rel="noopener noreferrer" class="btn btn-schedule">📅 予定 MAP を開く</a>
        <a href="/admin" target="_blank" rel="noopener noreferrer" class="btn btn-admin">⚙️ 管理者用 MAP を開く</a>
        
        <div class="hint">
            <b>💡 アプリのインストール（追加）方法</b><br>
            1. 上のボタンを押すと、それぞれのアプリ画面がブラウザで開きます。<br>
            2. 開いた先の画面で、スマホのメニューから<b>「ホーム画面に追加」</b>を行ってください。<br>
            3. 3つのアプリを個別にインストールできます。
        </div>
    </div>

    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js?v=portal', { scope: '/' });
      }
    </script>
</body>
</html>
