<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>情熱MAP 総合案内所 v1.05</title>
    
    <link rel="apple-touch-icon" href="/icon_index.png">
    <link rel="icon" href="/icon_index.png">
    <link rel="manifest" href="/manifest_portal.json">
    
    <style>
        body { font-family: sans-serif; background-color: #1a1a1a; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .container { text-align: center; background: #222; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); width: 85%; max-width: 400px; overflow-y: auto; max-height: 90vh; }
        h1 { color: #4CAF50; margin-bottom: 20px; font-size: 24px; }
        .btn { display: block; width: 100%; padding: 15px; margin-bottom: 10px; border-radius: 8px; font-size: 16px; font-weight: bold; text-decoration: none; color: white; box-sizing: border-box; transition: opacity 0.2s; }
        .btn:active { opacity: 0.7; }
        .btn-worker { background-color: #4CAF50; }
        .btn-schedule { background-color: #2196F3; }
        .btn-admin { background-color: #d32f2f; }
        
        /* 🌟LINE連携ブロックのデザインを復活 */
        .share-box { background: #333; padding: 20px; border-radius: 8px; margin-top: 20px; text-align: center; border: 1px solid #444; }
        .share-input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #555; border-radius: 4px; box-sizing: border-box; background: #222; color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>情熱MAP 総合案内所 (v1.05)</h1>
        
        <a href="/worker.html" class="btn btn-worker">🌿 作業員用 MAP を開く</a>
        <a href="/schedule" class="btn btn-schedule">📅 予定 MAP を開く</a>
        <a href="/admin.html" class="btn btn-admin">⚙️ 管理者用 MAP を開く</a>
        
        <div class="share-box">
            <h3 style="margin-top:0; color:#4CAF50; font-size: 16px;">📍 URLから直接地図を開く</h3>
            
            <div id="shareDirectMode" style="display:none;">
                <p style="font-size:13px; color:#FF9800; font-weight:bold;">共有された場所情報を受け取りました！<br>どちらのマップで開きますか？</p>
            </div>

            <div id="sharePasteMode">
                <p style="font-size:11px; color:#aaa; margin-bottom: 5px;">iPhoneの場合はURLをコピーして貼ってください</p>
                <input type="text" id="pastedUrl" class="share-input" placeholder="https://maps.app.goo.gl/...">
            </div>

            <div style="display:flex; gap:10px;">
                <button onclick="forwardMap('worker')" style="flex:1; background:#4CAF50; color:white; padding:12px; border:none; border-radius:6px; font-weight:bold;">作業者で開く</button>
                <button onclick="forwardMap('admin')" style="flex:1; background:#d32f2f; color:white; padding:12px; border:none; border-radius:6px; font-weight:bold;">管理者で開く</button>
            </div>
        </div>
        
    </div>

    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js?v=portal', { scope: '/' });
      }

      // 🌟URLのパラメータ（共有機能で送られてきたテキスト）を取得
      const urlParams = new URLSearchParams(window.location.search);
      const sharedText = urlParams.get('text') || urlParams.get('url');

      if (sharedText) {
        // 直接共有された場合は入力欄を消して案内を出す
        document.getElementById('shareDirectMode').style.display = 'block';
        document.getElementById('sharePasteMode').style.display = 'none';
      }

      // 🌟引き継ぎ処理（それぞれのMAPへバトンを渡す）
      function forwardMap(mode) {
        let finalParams = "";
        
        if (sharedText) {
          // すでにURLにパラメータがついている場合はそのまま引き継ぐ
          finalParams = window.location.search;
        } else {
          // 手動で入力された場合
          const inputUrl = document.getElementById('pastedUrl').value;
          if (!inputUrl) { alert("短縮URLが貼り付けられていません！"); return; }
          finalParams = "?text=" + encodeURIComponent(inputUrl);
        }

        // 行き先に応じて遷移（admin.htmlとworker.htmlがそれぞれバトンを受け取る！）
        if (mode === 'admin') {
          window.location.href = '/admin.html' + finalParams;
        } else {
          window.location.href = '/worker.html' + finalParams; 
        }
      }
    </script>
</body>
</html>
