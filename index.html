        const panel = document.getElementById('otherLinksPanel');
        const btn = document.getElementById('btnOtherLinksToggle');
        if (!panel || !btn) return;
        const open = !panel.classList.contains('is-open');
        panel.classList.toggle('is-open', open);
        btn.classList.toggle('is-open', open);
        panel.hidden = !open;
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      }

      const urlParams = new URLSearchParams(window.location.search);
      const sharedText = urlParams.get('text') || urlParams.get('url');

      if (sharedText) {
        const role = localStorage.getItem('passionMapUserRole');
        if (role === '管理者') {
          window.location.replace('admin.html' + window.location.search);
        } else {
          window.location.replace('worker.html' + window.location.search);
        }
      }

      function switchAuthTab(mode) {
        const loginSec = document.getElementById('authSectionLogin');
        const signupSec = document.getElementById('authSectionSignup');
        const tabLogin = document.getElementById('tabBtnLogin');
        const tabSignup = document.getElementById('tabBtnSignup');

        if (mode === 'signup') {
          if (loginSec) loginSec.style.display = 'none';
          if (signupSec) signupSec.style.display = 'block';
          if (tabLogin) { tabLogin.style.color = '#aaa'; tabLogin.style.borderBottomColor = 'transparent'; tabLogin.style.fontWeight = 'normal'; }
          if (tabSignup) { tabSignup.style.color = '#a5d6a7'; tabSignup.style.borderBottomColor = '#4CAF50'; tabSignup.style.fontWeight = 'bold'; }
          const first = document.getElementById('signupUserName');
          if (first) setTimeout(function() { first.focus(); }, 50);
          loadPortalSignupLocations();
        } else {
          if (loginSec) loginSec.style.display = 'block';
          if (signupSec) signupSec.style.display = 'none';
          if (tabLogin) { tabLogin.style.color = '#a5d6a7'; tabLogin.style.borderBottomColor = '#4CAF50'; tabLogin.style.fontWeight = 'bold'; }
          if (tabSignup) { tabSignup.style.color = '#aaa'; tabSignup.style.borderBottomColor = 'transparent'; tabSignup.style.fontWeight = 'normal'; }
          const first = document.getElementById('loginUserId');
          if (first) setTimeout(function() { first.focus(); }, 50);
        }
      }

      function escapeHtml(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function isLoggedInPortal() {
        return !!(localStorage.getItem('passionMapUserId') || '').trim();
      }

      function showLoggedInAccountView() {
        const loggedInSec = document.getElementById('authSectionLoggedIn');
        const formsWrap = document.getElementById('authFormsWrap');
        const title = document.getElementById('accountModalTitle');
        const info = document.getElementById('loggedInInfo');
        const userId = localStorage.getItem('passionMapUserId') || '';
        const userName = localStorage.getItem('passionMapUserName') || '';
        const userRole = localStorage.getItem('passionMapUserRole') || '作業員';
        const roleColor = (userRole === '管理者') ? '#e53935' : '#4CAF50';

        if (loggedInSec) loggedInSec.style.display = 'block';
        if (formsWrap) formsWrap.style.display = 'none';
        if (title) title.textContent = '👤 アカウント';
        if (info) {
          info.innerHTML = `
            <div class="account-session-row">
              <span class="account-session-label">表示名</span>
              <span class="account-session-value">${escapeHtml(userName || userId)}</span>
            </div>
            <div class="account-session-row">
              <span class="account-session-label">スタッフID</span>
              <span class="account-session-value">${escapeHtml(userId)}</span>
            </div>
            <div class="account-session-row">
              <span class="account-session-label">権限</span>
              <span class="account-role-badge" style="background:${roleColor};">${escapeHtml(userRole)}</span>
            </div>
            <div style="font-size:11px; color:#81c784; margin-top:8px; line-height:1.4;">ログイン状態はすべてのMAPに引き継がれます。</div>
          `;
        }
      }

      function showAuthFormsView(initialTab) {
        const loggedInSec = document.getElementById('authSectionLoggedIn');
        const formsWrap = document.getElementById('authFormsWrap');
        const title = document.getElementById('accountModalTitle');
        if (loggedInSec) loggedInSec.style.display = 'none';
        if (formsWrap) formsWrap.style.display = 'block';
        if (title) title.textContent = '🔐 アカウント認証';
        switchAuthTab(initialTab || 'login');
      }

      function openAccountModal(initialTab) {
        const modal = document.getElementById('accountModal');
        if (!modal) return;
        if (isLoggedInPortal()) {
          showLoggedInAccountView();
        } else {
          showAuthFormsView(initialTab || 'login');
        }
        modal.classList.add('is-open');
      }

      function closeAccountModal() {
        const modal = document.getElementById('accountModal');
        if (modal) modal.classList.remove('is-open');
      }

      function onAccountModalBackdrop(e) {
        if (e.target === e.currentTarget) closeAccountModal();
      }

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeAccountModal();
      });

      function setMsg(elId, text, ok) {
        const el = document.getElementById(elId);
        if (!el) return;
        el.textContent = text || '';
        el.classList.toggle('is-ok', !!ok);
        el.classList.toggle('is-error', !ok && !!text);
      }

      async function callPortalGAS(action, params) {
        return callGAS(action, Object.assign({ orgId: PORTAL_ORG_ID }, params || {}));
      }

      function saveLoginLocal(userId, password, name, role, spreadsheetId, extra) {
        try {
          localStorage.setItem('passionMapUserId', userId || '');
          localStorage.setItem('passionMapUserPw', password || '');
          localStorage.setItem('passionMapUserName', name || '');
          localStorage.setItem('passionMapUserRole', role || '作業員');
          if (spreadsheetId) localStorage.setItem('spreadsheetId', spreadsheetId);
          localStorage.setItem('passionMapOrgId', PORTAL_ORG_ID);
          if (extra && extra.location != null) {
            localStorage.setItem('passionMapUserLocation', extra.location || '');
          }

          if (role === '管理者') {
            localStorage.setItem('pMapAdminOrgId', PORTAL_ORG_ID);
            localStorage.setItem('pMapAdminId', userId || '');
            localStorage.setItem('pMapAdminPw', password || '');
            localStorage.setItem('pMapAdminName', name || '');
          }
        } catch (e) {}
        updateLoginDisplay();
      }

      let _portalGoogleAccessToken = '';
      let _portalLineAccessToken = '';

      async function loadPortalSignupLocations(prefetchedLocations) {
        const sel = document.getElementById('signupLocation');
        if (!sel) return;
        if (Array.isArray(prefetchedLocations) && prefetchedLocations.length) {
          let html = '<option value="">拠点を選択...</option>';
          prefetchedLocations.forEach(function(l) {
            const v = String(l || '').trim();
            if (!v) return;
            html += '<option value="' + escapeHtml(v) + '">' + escapeHtml(v) + '</option>';
          });
          sel.innerHTML = html;
          sel.setAttribute('data-loaded', '1');
          return;
        }
        if (sel.getAttribute('data-loaded') === '1') return;
        sel.innerHTML = '<option value="">読み込み中...</option>';
        try {
          const data = await callPortalGAS('getSignupOptions', {});
          if (data && data.googleClientId) {
            try { localStorage.setItem('passionMapGoogleClientId', String(data.googleClientId).trim()); } catch (e) {}
          }
          if (data && data.lineChannelId) {
            try { localStorage.setItem('passionMapLineChannelId', String(data.lineChannelId).trim()); } catch (e) {}
          }
          const locs = (data && Array.isArray(data.locations)) ? data.locations : [];
          let html = '<option value="">拠点を選択...</option>';
          locs.forEach(function(l) {
            const v = String(l || '').trim();
            if (!v) return;
            html += '<option value="' + escapeHtml(v) + '">' + escapeHtml(v) + '</option>';
          });
          if (!locs.length) html += '<option value="" disabled>拠点マスタが空です</option>';
          sel.innerHTML = html;
          sel.setAttribute('data-loaded', '1');
        } catch (e) {
          sel.innerHTML = '<option value="">拠点の取得に失敗しました</option>';
        }
      }

      function applyPortalGoogleSignupProfile_(profile, accessToken, locations) {
        _portalGoogleAccessToken = accessToken || '';
        _portalLineAccessToken = '';
        switchAuthTab('signup');
        if (Array.isArray(locations) && locations.length) {
          loadPortalSignupLocations(locations);
        } else {
          loadPortalSignupLocations();
        }
        const nameEl = document.getElementById('signupUserName');
        const emailEl = document.getElementById('signupEmail');
        const emailLabel = document.getElementById('signupEmailLabel');
        const pwWrap = document.getElementById('signupPasswordWrap');
        const banner = document.getElementById('signupGoogleLinkedBanner');
        const gBtnText = document.getElementById('btnGoogleSignupText');
        if (nameEl && !nameEl.value.trim() && profile && profile.name) {
          nameEl.value = profile.name;
        }
        if (emailEl && profile && profile.email) {
          emailEl.value = profile.email;
          emailEl.readOnly = true;
          emailEl.style.opacity = '0.85';
        }
        if (emailLabel) emailLabel.textContent = 'メールアドレス';
        if (pwWrap) {
          pwWrap.style.display = 'none';
        }
        if (banner && profile) {
          banner.style.display = 'block';
          banner.innerHTML = '✅ Google連携済み: <strong>' + escapeHtml(profile.email || '') + '</strong><br><span style="font-size:11px; color:#a5d6a7;">パスワード入力は不要です。拠点名を選んで「登録する」を押してください。</span>';
        }
        if (gBtnText) {
          gBtnText.textContent = '別のGoogleアカウントを選び直す';
        }
        setMsg('signupMsg', 'あと「拠点名」を選択して「登録する」を押してください', true);
        const locEl = document.getElementById('signupLocation');
        if (locEl) setTimeout(function() { locEl.focus(); }, 80);
      }

      function applyPortalLineSignupProfile_(profile, lineAccessToken, locations) {
        _portalLineAccessToken = lineAccessToken || '';
        _portalGoogleAccessToken = '';
        switchAuthTab('signup');
        if (Array.isArray(locations) && locations.length) {
          loadPortalSignupLocations(locations);
        } else {
          loadPortalSignupLocations();
        }
        const nameEl = document.getElementById('signupUserName');
        const emailEl = document.getElementById('signupEmail');
        const emailLabel = document.getElementById('signupEmailLabel');
        const pwWrap = document.getElementById('signupPasswordWrap');
        const banner = document.getElementById('signupGoogleLinkedBanner');
        const lBtnText = document.getElementById('btnLineSignupText');
        if (nameEl && !nameEl.value.trim() && profile && profile.name) {
          nameEl.value = profile.name;
        }
        if (emailEl) {
          emailEl.readOnly = false;
          emailEl.style.opacity = '1';
          emailEl.placeholder = '任意（空欄でも登録可）';
        }
        if (emailLabel) emailLabel.textContent = 'メールアドレス（任意）';
        if (pwWrap) {
          pwWrap.style.display = 'none';
        }
        if (banner && profile) {
          banner.style.display = 'block';
          banner.innerHTML = '✅ LINE連携済み: <strong>' + escapeHtml(profile.name || '') + '</strong><br><span style="font-size:11px; color:#a5d6a7;">パスワード・メール入力は不要です。拠点名を選んで「登録する」を押してください。</span>';
        }
        if (lBtnText) {
          lBtnText.textContent = '別のLINEアカウントを選び直す';
        }
        setMsg('signupMsg', 'あと「拠点名」を選択して「登録する」を押してください', true);
        const locEl = document.getElementById('signupLocation');
        if (locEl) setTimeout(function() { locEl.focus(); }, 80);
      }

      async function startPortalLineAuth(fromMode) {
        const msgId = (fromMode === 'signup') ? 'signupMsg' : ((fromMode === 'link') ? 'loggedInMsg' : 'loginMsg');
        setMsg(msgId, '', true);
        if (!window.PassionMapLineAuth) {
          setMsg(msgId, 'LINE認証モジュールが読み込まれていません', false);
          return;
        }
        try {
          const locVal = (fromMode === 'signup' && document.getElementById('signupLocation'))
            ? (document.getElementById('signupLocation').value || '').trim()
            : '';
          const userNameVal = (fromMode === 'signup' && document.getElementById('signupUserName'))
            ? (document.getElementById('signupUserName').value || '').trim()
            : '';
          const linkUserId = (fromMode === 'link') ? (localStorage.getItem('passionMapUserId') || '') : '';
          const linkPassword = (fromMode === 'link') ? (localStorage.getItem('passionMapUserPw') || '') : '';
          await window.PassionMapLineAuth.startRedirect({
            fromMode: fromMode,
            location: locVal,
            userName: userNameVal,
            linkUserId: linkUserId,
            linkPassword: linkPassword
          });
        } catch (e) {
          setMsg(msgId, e.message || String(e), false);
        }
      }

      async function handlePortalLineCallback_() {
        if (!window.PassionMapLineAuth) return;
        const cb = window.PassionMapLineAuth.consumeCallback();
        if (!cb) return;
        const fromMode = cb.fromMode || 'login';
        openAccountModal(fromMode === 'signup' ? 'signup' : 'login');
        const msgId = (fromMode === 'signup') ? 'signupMsg' : ((fromMode === 'link') ? 'loggedInMsg' : 'loginMsg');
        if (cb.error) {
          setMsg(msgId, cb.error, false);
          return;
        }
        setMsg(msgId, 'LINEアカウントを照合しています...', true);
        try {
          const data = await callPortalGAS('lineAuth', {
            code: cb.code,
            redirectUri: cb.redirectUri,
            location: cb.location || '',
            userName: cb.userName || '',
            linkUserId: cb.linkUserId || '',
            linkPassword: cb.linkPassword || ''
          });
          if (data && data.status === 'linked') {
            setMsg('loggedInMsg', data.message || 'LINE連携が完了しました', true);
            return;
          }
          if (data && data.status === 'needs_signup' && data.lineProfile) {
            applyPortalLineSignupProfile_(data.lineProfile, data.lineAccessToken || '', data.locations);
            if (data.success === false && data.message) {
              setMsg('signupMsg', data.message, false);
            }
            return;
          }
          if (!data || !data.success) {
            setMsg(msgId, (data && data.message) || 'LINE認証に失敗しました', false);
            return;
          }
          const userId = data.userId || data.name || '';
          const password = data.password || '';
          const userName = data.name || userId;
          const userRole = data.role || '作業員';
          saveLoginLocal(userId, password, userName, userRole, data.spreadsheetId || '', {
            location: data.location || cb.location || ''
          });
          setMsg(msgId, (data.status === 'registered' ? 'LINEアカウントで新規登録しました' : `LINEログイン完了 (${userName})`), true);
          if (window.PassionMapTerms && typeof PassionMapTerms.ensureAccepted === 'function') {
            await PassionMapTerms.ensureAccepted({ userId: userId });
          }
          setTimeout(function() {
            closeAccountModal();
          }, 600);
        } catch (e) {
          setMsg(msgId, e.message || String(e), false);
        }
      }

      async function startPortalGoogleAuth(fromMode) {
        const msgId = (fromMode === 'signup') ? 'signupMsg' : 'loginMsg';
        const btnLogin = document.getElementById('btnGoogleLogin');
        const btnSignup = document.getElementById('btnGoogleSignup');
        setMsg(msgId, '', true);
        if (!window.PassionMapGoogleAuth) {
          setMsg(msgId, 'Google認証モジュールが読み込まれていません', false);
          return;
        }
        if (btnLogin) btnLogin.disabled = true;
        if (btnSignup) btnSignup.disabled = true;
        try {
          const accessToken = await window.PassionMapGoogleAuth.requestAccessToken();
          setMsg(msgId, 'Googleアカウントを照合しています...', true);
          const locVal = (fromMode === 'signup' && document.getElementById('signupLocation'))
            ? (document.getElementById('signupLocation').value || '').trim()
            : '';
          const userNameVal = (fromMode === 'signup' && document.getElementById('signupUserName'))
            ? (document.getElementById('signupUserName').value || '').trim()
            : '';
          const pwVal = (fromMode === 'signup' && document.getElementById('signupPassword'))
            ? (document.getElementById('signupPassword').value || '')
            : '';

          const data = await callPortalGAS('googleAuth', {
            accessToken: accessToken,
            location: locVal,
            userName: userNameVal,
            password: pwVal
          });

          if (data && data.status === 'needs_signup' && data.googleProfile) {
            applyPortalGoogleSignupProfile_(data.googleProfile, accessToken, data.locations);
            if (data.success === false && data.message) {
              setMsg('signupMsg', data.message, false);
            }
            return;
          }

          if (!data || !data.success) {
            setMsg(msgId, (data && data.message) || 'Google認証に失敗しました', false);
            return;
          }

          const userId = data.userId || data.name || '';
          const password = data.password || '';
          const userName = data.name || userId;
          const userRole = data.role || '作業員';
          saveLoginLocal(userId, password, userName, userRole, data.spreadsheetId || '', {
            location: data.location || locVal || ''
          });
          setMsg(msgId, (data.status === 'registered' ? 'Googleアカウントで新規登録しました' : `Googleログイン完了 (${userName})`), true);
          if (window.PassionMapTerms && typeof PassionMapTerms.ensureAccepted === 'function') {
            await PassionMapTerms.ensureAccepted({ userId: userId });
          }
          setTimeout(function() {
            closeAccountModal();
          }, 600);
        } catch (e) {
          setMsg(msgId, e.message || String(e), false);
        } finally {
          if (btnLogin) btnLogin.disabled = false;
          if (btnSignup) btnSignup.disabled = false;
        }
      }

      async function submitSignup() {
        const userName = (document.getElementById('signupUserName').value || '').trim();
        const password = document.getElementById('signupPassword').value || '';
        const confirm = document.getElementById('signupPasswordConfirm').value || '';
        const location = (document.getElementById('signupLocation').value || '').trim();
        const email = (document.getElementById('signupEmail').value || '').trim();
        const btn = document.getElementById('signupBtn');
        const isGoogleLinked = !!_portalGoogleAccessToken;
        const isLineLinked = !!_portalLineAccessToken;
        const isOAuthLinked = isGoogleLinked || isLineLinked;

        if (!userName) {
          setMsg('signupMsg', 'ユーザー名を入力してください', false);
          return;
        }
        if (!isOAuthLinked) {
          if (!password) {
            setMsg('signupMsg', 'パスワードを入力してください', false);
            return;
          }
          if (password.length < 4) {
            setMsg('signupMsg', 'パスワードは4文字以上で入力してください', false);
            return;
          }
          if (password !== confirm) {
            setMsg('signupMsg', 'パスワード（確認）が一致しません', false);
            return;
          }
        } else if (password) {
          if (password.length < 4) {
            setMsg('signupMsg', 'パスワードは4文字以上で入力してください', false);
            return;
          }
          if (password !== confirm) {
            setMsg('signupMsg', 'パスワード（確認）が一致しません', false);
            return;
          }
        }
        if (!location) {
          setMsg('signupMsg', '拠点名を選択してください', false);
          return;
        }
        if (!isLineLinked && !email) {
          setMsg('signupMsg', 'メールアドレスを入力してください', false);
          return;
        }
        if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          setMsg('signupMsg', 'メールアドレスの形式が正しくありません', false);
          return;
        }

        if (btn) { btn.disabled = true; btn.textContent = '登録中...'; }
        setMsg('signupMsg', '', true);
        try {
          const data = await callPortalGAS('signup', {
            userId: userName,
            userName: userName,
            password: password,
            location: location,
            email: email,
            googleAccessToken: _portalGoogleAccessToken || '',
            lineAccessToken: _portalLineAccessToken || ''
          });
          if (!data || !data.success) {
            setMsg('signupMsg', (data && data.message) || '登録に失敗しました', false);
            return;
          }
          const savedPw = data.password || password;
          saveLoginLocal(userName, savedPw, data.name || userName, '作業員', data.spreadsheetId, {
            location: data.location || location
          });
          _portalGoogleAccessToken = '';
          _portalLineAccessToken = '';
          setMsg('signupMsg', '登録完了。作業員用 MAP を開けます', true);
          document.getElementById('signupPassword').value = '';
          document.getElementById('signupPasswordConfirm').value = '';
          if (window.PassionMapTerms && typeof PassionMapTerms.ensureAccepted === 'function') {
            await PassionMapTerms.ensureAccepted({ userId: userName });
          }
          setTimeout(function() {
            closeAccountModal();
          }, 800);
        } catch (e) {
          setMsg('signupMsg', e.message || String(e), false);
        } finally {
          if (btn) { btn.disabled = false; btn.textContent = '登録する'; }
        }
      }

      function logoutFromIndex() {
        try {
          localStorage.removeItem('passionMapUserId');
          localStorage.removeItem('passionMapUserPw');
          localStorage.removeItem('passionMapUserName');
          localStorage.removeItem('passionMapUserRole');
          localStorage.removeItem('pMapAdminId');
          localStorage.removeItem('pMapAdminPw');
          localStorage.removeItem('pMapAdminName');
        } catch (e) {}
        updateLoginDisplay();
        closeAccountModal();
      }

      function updateLoginDisplay() {
        const userId = localStorage.getItem('passionMapUserId') || '';
        const userName = localStorage.getItem('passionMapUserName') || '';
        const btnAuth = document.getElementById('btnAuthStatusToggle');

        if (userId) {
          if (btnAuth) {
            btnAuth.textContent = `👤 ${userName || userId}`;
            btnAuth.style.background = '#2e7d32';
            btnAuth.style.borderColor = '#388e3c';
            btnAuth.style.color = '#fff';
          }
        } else {
          if (btnAuth) {
            btnAuth.textContent = '🔑 ログイン / 登録';
            btnAuth.style.background = '#333';
            btnAuth.style.borderColor = '#555';
            btnAuth.style.color = '#a5d6a7';
          }
        }
      }

      async function submitLogin() {
        const userId = (document.getElementById('loginUserId').value || '').trim();
        const password = document.getElementById('loginPassword').value || '';
        const btn = document.getElementById('loginBtn');

        if (!userId || !password) {
          setMsg('loginMsg', 'スタッフIDとパスワードを入力してください', false);
          return;
        }

        if (btn) { btn.disabled = true; btn.textContent = 'ログイン確認中...'; }
        setMsg('loginMsg', '', true);

        try {
          const data = await callPortalGAS('login', {
            userId: userId,
            password: password
          });

          if (!data || data.success === false) {
            setMsg('loginMsg', (data && data.message) || 'IDまたはパスワードが違います', false);
            return;
          }

          const userName = data.name || userId;
          const userRole = data.role || '作業員';
          const spreadsheetId = data.spreadsheetId || '';

          saveLoginLocal(userId, password, userName, userRole, spreadsheetId, {
            location: data.location || ''
          });
          setMsg('loginMsg', `ログイン完了 (${userName})`, true);
          updateLoginDisplay();
          if (window.PassionMapTerms && typeof PassionMapTerms.ensureAccepted === 'function') {
            await PassionMapTerms.ensureAccepted({ userId: userId });
          }

          setTimeout(function() {
            closeAccountModal();
          }, 600);
        } catch (e) {
          setMsg('loginMsg', e.message || String(e), false);
        } finally {
          if (btn) { btn.disabled = false; btn.textContent = 'ログインする'; }
        }
      }

      document.addEventListener('DOMContentLoaded', function() {
        updateLoginDisplay();
        handlePortalLineCallback_();
      });
      updateLoginDisplay();
    </script>
