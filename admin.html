<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>情熱MAP [管理者用]</title>
    <link rel="apple-touch-icon" href="icon_admin.png">
    <link rel="icon" href="icon_admin.png">
    <link rel="manifest" href="manifest_admin.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="admin.css">
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
  </head>
  <body>
    <div id="loginScreen"><div class="login-box"><h2>情熱MAP [管理]</h2><div id="loginError" style="color:red; margin-bottom:10px; font-size:14px; font-weight:bold;"></div><input type="text" id="loginId" class="login-input" placeholder="スタッフID"><input type="password" id="loginPw" class="login-input" placeholder="パスワード"><button class="login-btn" id="loginBtn" onclick="executeLogin()">管理者としてログイン</button></div></div>
    
    <div id="cadOverlay">
        <div id="cadHeader">
          <div style="font-weight:bold; font-size:16px;">🚜 農業CAD <span id="cadTargetName" style="font-size:12px; color:#aaa; margin-left:10px;"></span></div>
          <button onclick="closeCADMode()" style="background:#f44336; color:#fff; border:none; padding:8px 15px; border-radius:4px; font-weight:bold; font-size:14px; cursor:pointer;">閉じる</button>
        </div>
        
        <div id="cadMapWrapper">
          <div id="cadMap"></div>
          <!-- 🔍 ズームボタンを追加 -->
          <div style="position: absolute; right: 15px; top: 15px; display: flex; flex-direction: column; gap: 8px; z-index: 1000;">
              <button onclick="cadZoomIn()" style="width: 44px; height: 44px; border-radius: 50%; background: rgba(0, 0, 0, 0.7); color: white; border: 1px solid rgba(255, 255, 255, 0.3); font-size: 24px; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3); outline: none;">＋</button>
              <button onclick="cadZoomOut()" style="width: 44px; height: 44px; border-radius: 50%; background: rgba(0, 0, 0, 0.7); color: white; border: 1px solid rgba(255, 255, 255, 0.3); font-size: 24px; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3); outline: none;">－</button>
          </div>
        </div>
        
        <div class="cad-panel" style="padding: 8px 12px; max-height: 45vh; overflow-y: auto; padding-bottom: calc(15px + env(safe-area-inset-bottom));">
            <div style="display:flex; gap:0; margin-bottom:8px; border-bottom:2px solid #555;">
              <div id="cadTab1" onclick="switchCadTab(1)" style="flex:1; text-align:center; padding:6px; cursor:pointer; font-weight:bold; background:#FF9800; color:#fff; border-radius:6px 0 0 0; font-size:12px;">① 生成モード</div>
              <div id="cadTab2" onclick="switchCadTab(2)" style="flex:1; text-align:center; padding:6px; cursor:pointer; font-weight:bold; background:#222; color:#aaa; border-radius:0 6px 0 0; font-size:12px;">② 編集・保存</div>
            </div>
    
            <div id="cadMode1">
              <div style="display:flex; gap:10px; margin-bottom:8px; align-items:flex-end;">
                <div style="flex:1;">
                  <label style="font-size:11px; color:#aaa; margin-bottom:2px; display:block;">🧭 方角(度)</label>
                  <input type="number" id="cadAngle" value="0" style="width:100%; padding:6px; border-radius:4px; border:none; box-sizing:border-box; font-size:14px;" oninput="updateCadPreviewCount()">
                </div>
                <div style="flex:1;">
                  <label style="font-size:11px; color:#aaa; margin-bottom:2px; display:block;">📏 基準の畝幅(cm)</label>
                  <input type="number" id="cadWidth" value="150" style="width:100%; padding:6px; border-radius:4px; border:none; box-sizing:border-box; font-size:14px;" oninput="updateCadPreviewCount()">
                </div>
              </div>
              
              <div style="display:flex; gap:5px; margin-bottom:10px;">
                 <button onclick="cadSnapAngle()" style="flex:2; background:#333; color:#FFC107; border:1px solid #FFC107; padding:6px; border-radius:4px; font-size:12px; font-weight:bold;">🧲 近くの直線にピタッと合わせる</button>
                 <button onclick="cadRotateMap(-5)" style="flex:1; background:#555; color:#fff; border:none; border-radius:4px; font-size:12px; font-weight:bold;">↩️</button>
                 <button onclick="cadRotateMap(5)" style="flex:1; background:#555; color:#fff; border:none; border-radius:4px; font-size:12px; font-weight:bold;">↪️</button>
              </div>
              
              <div style="display:flex; gap:10px; align-items:center;">
                  <div style="background:#333; flex:1; padding:6px; border-radius:4px; text-align:center; border:1px solid #555; display:flex; justify-content:center; align-items:center; gap:8px;">
                     <span style="font-size:11px; color:#aaa;">確定畝数:</span>
                     <input type="number" id="cadUneCount" value="0" style="width:50px; font-size:16px; font-weight:bold; color:#8BC34A; background:transparent; border:none; text-align:center;">
                  </div>
                  <button onclick="cadGenerateLines()" style="flex:1.5; background:#4CAF50; color:white; border:none; padding:10px; border-radius:4px; font-weight:bold; font-size:13px;">🚜 畝を均等に生成</button>
              </div>
            </div>
    
            <div id="cadMode2" style="display:none;">
              <div style="font-size:11px; color:#aaa; margin-bottom:2px;">📍 設備ピンと補助線</div>
              <div style="display:flex; gap:5px; margin-bottom:10px;">
                 <button onclick="cadSetPinMode('water_in')" style="flex:1; background:#03A9F4; color:white; border:none; padding:6px; border-radius:4px; font-weight:bold; font-size:11px;">💧 吸水ピン</button>
                 <button onclick="cadSetPinMode('water_out')" style="flex:1; background:#8D6E63; color:white; border:none; padding:6px; border-radius:4px; font-weight:bold; font-size:11px;">🕳️ 排水ピン</button>
                 <button onclick="cadToggleGrid()" style="flex:1; background:#FF9800; color:white; border:none; padding:6px; border-radius:4px; font-weight:bold; font-size:11px;">📏 1mグリッド</button>
              </div>
              
              <div style="font-size:11px; color:#aaa; margin-bottom:2px;">✂️ 地形・自由畝の追加 (タップで移動/変形可能)</div>
              <div style="display:flex; gap:5px; margin-bottom:5px;">
                 <button onclick="cadSetPinMode('nakamichi')" style="flex:1; background:#9C27B0; color:white; border:none; padding:6px; border-radius:4px; font-weight:bold; font-size:11px;">🛤 中道ライン</button>
                 <button onclick="cadAddCustomShape('rect')" style="flex:1; background:#8BC34A; color:white; border:none; padding:6px; border-radius:4px; font-weight:bold; font-size:11px;">⬛ 四角畝</button>
                 <button onclick="cadAddCustomShape('circle')" style="flex:1; background:#8BC34A; color:white; border:none; padding:6px; border-radius:4px; font-weight:bold; font-size:11px;">⚫ 丸畝</button>
              </div>
              <div id="cadPinModeMsg" style="font-size:10px; color:#FF9800; text-align:center; margin-bottom:10px;">💡 畝を直接タップすると、十字キーで移動や変形ができます。</div>
    
              <!-- 🌟 新機能：履歴（戻る・進む）ボタン -->
              <div style="display:flex; gap:5px; margin-bottom:10px;">
                 <button id="cadUndoBtn" onclick="cadUndoAction()" disabled style="flex:1; background:#607D8B; color:white; border:none; padding:8px; border-radius:4px; font-weight:bold; font-size:12px;">↩️ 戻す</button>
                 <button id="cadRedoBtn" onclick="cadRedoAction()" disabled style="flex:1; background:#607D8B; color:white; border:none; padding:8px; border-radius:4px; font-weight:bold; font-size:12px;">↪️ 進む</button>
              </div>
    
              <div style="display:flex; gap:10px;">
                <div style="display:flex; gap:10px;">
                  <button onclick="saveUneSim()" style="flex:2; background:#2196F3; color:white; border:none; padding:10px; border-radius:4px; font-weight:bold; font-size:14px;">💾 描画図面を保存</button>
                  <button onclick="cadUserClearLines()" style="flex:1; background:#f44336; color:white; border:none; padding:10px; border-radius:4px; font-weight:bold; font-size:12px;">🗑️ クリア</button>
                </div>
              </div>
            </div>
          </div> <div id="cadEditPolyModal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.6); z-index:999999; justify-content:center; align-items:center;">
            <div style="background:#fff; color:#333; padding:20px; border-radius:12px; width:90%; max-width:300px; text-align:center; box-shadow: 0 4px 20px rgba(0,0,0,0.3);">
                <h3 style="margin-top:0; border-bottom:2px solid #8BC34A; padding-bottom:10px;">🛠 ポリゴンの操作</h3>
                <input type="hidden" id="cadEditIndex">
                
                <div style="display:flex; gap:10px; margin-top:20px;">
                    <button onclick="window.cadDeletePoly()" style="flex:1; background:#F44336; color:white; padding:14px; border-radius:8px; font-size:16px; font-weight:bold; border:none; cursor:pointer;">🗑 削除する</button>
                    <button onclick="document.getElementById('cadEditPolyModal').style.display='none'" style="flex:1; background:#ccc; color:#333; padding:14px; border-radius:8px; font-size:16px; font-weight:bold; border:none; cursor:pointer;">閉じる</button>
                </div>
            </div>
        </div>
          
          
      <div id="customAlertModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 10000; justify-content: center; align-items: center;">
        <div style="background: #fff; color: #333; padding: 20px; border-radius: 8px; width: 80%; max-width: 300px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3);">
          <div id="customAlertMessage" style="margin-bottom: 20px; font-size: 15px; font-weight: bold; line-height: 1.5;"></div>
          
          <div id="tutorialCheckboxWrapper" style="display: none; margin-bottom: 15px; text-align: center; font-size: 12px; color: #555;">
            <label style="cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px;">
              <input type="checkbox" id="dontShowAgainCheckbox" style="transform: scale(1.2);"> 今後このメッセージを表示しない
            </label>
          </div>
  
          <button id="customAlertOk" style="width: 100%; background: #2196F3; color: #fff; padding: 12px; border-radius: 4px; border: none; font-weight: bold; cursor: pointer;">OK</button>
        </div>
      </div>

    <div id="customConfirmModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center;">
      <div style="background: #fff; color: #333; padding: 20px; border-radius: 8px; width: 80%; max-width: 300px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3);">
        <div id="customConfirmMessage" style="margin-bottom: 20px; font-size: 15px; font-weight: bold; line-height: 1.5;"></div>
        <div style="display: flex; gap: 10px;">
          <button id="customConfirmOk" style="flex: 1; background: #d32f2f; color: #fff; padding: 12px; border-radius: 4px; border: none; font-weight: bold; cursor: pointer;">はい</button>
          <button id="customConfirmCancel" style="flex: 1; background: #ccc; color: #333; padding: 12px; border-radius: 4px; border: none; font-weight: bold; cursor: pointer;">いいえ</button>
        </div>
      </div>
    </div>

    <div id="customPromptModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center;">
      <div style="background: #fff; color: #333; padding: 20px; border-radius: 8px; width: 80%; max-width: 300px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3);">
        <div id="customPromptMessage" style="margin-bottom: 10px; font-size: 15px; font-weight: bold; line-height: 1.5;"></div>
        <input type="text" id="customPromptInput" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px;">
        <div style="display: flex; gap: 10px;">
          <button id="customPromptOk" style="flex: 1; background: #4CAF50; color: #fff; padding: 12px; border-radius: 4px; border: none; font-weight: bold; cursor: pointer;">OK</button>
          <button id="customPromptCancel" style="flex: 1; background: #ccc; color: #333; padding: 12px; border-radius: 4px; border: none; font-weight: bold; cursor: pointer;">キャンセル</button>
        </div>
      </div>
    </div>

    <div id="modal"><div class="modal-content" id="modalBody"></div></div>

    <div id="masterModal">
      <div style="background:#fff; color:#333; padding:20px; border-radius:8px; width:90%; max-width:400px; max-height:85%; display:flex; flex-direction:column;">
        <h3 style="margin-top:0; color:#d32f2f;">⚙️ マスタ項目設定</h3>
        <div id="masterSections" style="overflow-y:auto; flex:1; padding-right:5px;"></div>
        <button onclick="document.getElementById('masterModal').style.display='none'" style="width:100%; padding:12px; background:#666; color:#fff; border-radius:4px; margin-top:15px; border:none; font-weight:bold; font-size:16px;">閉じる</button>
      </div>
    </div>

    <div id="feedbackModal">
       <div style="background:#222; color:#fff; width:90%; max-width:400px; border-radius:8px; display:flex; flex-direction:column; padding:20px; box-sizing:border-box; border:1px solid #444;">
           <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
              <h3 style="margin:0; color:#d32f2f; font-size:18px;">✉️ システム管理者へ連絡</h3>
              <span onclick="closeFeedback()" style="cursor:pointer; font-size:24px; color:#999; line-height:1;">×</span>
           </div>
           <p style="font-size:12px; color:#aaa; margin-top:0;">バグの報告や機能追加の要望などをご記入ください。</p>
           <textarea id="feedbackText" rows="6" placeholder="例：〇〇の画面でエラーが出ます。〇〇の機能を追加してほしいです。" style="width:100%; padding:10px; border-radius:4px; border:1px solid #555; background:#333; color:#fff; box-sizing:border-box; margin-bottom:15px; resize:none;"></textarea>
           <button id="sendFeedbackBtn" onclick="sendFeedback()" style="width:100%; background:#d32f2f; color:#fff; border:none; padding:12px; border-radius:4px; font-weight:bold; font-size:16px;">送信する</button>
       </div>
    </div>
    
    <div class="control-panel">
      <div class="control-row">
        <div class="search-container">
          <input type="text" id="searchInput" class="search-input" placeholder="🔍 圃場・看板...">
          <div id="searchSuggestions"></div>
        </div>
        <div class="search-container">
          <input type="text" id="mapSearchInput" class="search-input" placeholder="🌍 住所・地域...">
        </div>
        <button onclick="promptLineUrl()" style="background:#9C27B0; color:white; border:none; padding:8px 12px; border-radius:5px; font-weight:bold; font-size:11px;">📍 座標検索</button>
        <button id="btnCurrentLocation" class="gps-btn">🧭 現在地</button>
        <button onclick="openFeedback()" style="background:#444; color:white; border:none; font-weight:bold; font-size:11px; padding:8px 12px; border-radius:5px;">✉️ 連絡</button>
        <button onclick="executeLogout()" style="background:#F44336; color:white; border:none; font-weight:bold; font-size:11px; padding:8px 12px; border-radius:5px;">ログアウト</button>
      </div>
      <div class="control-row">
        <button id="btnViewMode" class="mode-btn active">👀 閲覧</button>
        <button id="btnDrawMode" class="mode-btn">✏️ 圃場</button>
        <button id="btnMarkerMode" class="mode-btn">📍 看板</button>
        <button onclick="openMasterModal()" style="background:#2196F3; color:white; border-radius:5px; border:none; padding:8px 12px; font-weight:bold; font-size:13px;">⚙️ マスタ</button>
      </div>
      <div id="drawArea" class="action-bar" style="display:none;">
        <div id="drawStep1">
          <div style="display:flex; gap:8px; margin-bottom:8px;">
            <button id="btnManualDraw" style="flex:1; background:#00BCD4; color:white; border:none; border-radius:4px; font-weight:bold; padding:10px;">👆 手動で描く</button>
            <button id="btnLoadFude" style="flex:1; background:#673AB7; color:white; border:none; border-radius:4px; font-weight:bold; padding:10px;">🤖 筆ポリから</button>
          </div>
          <div style="display:flex; gap:8px;">
            <button id="undoDrawBtn" style="background:#FF9800; color:white; flex:1; border:none; border-radius:4px; font-weight:bold; padding:10px;" disabled>↩️ 1つ戻す</button>
            <button id="step1SaveBtn" style="background:#4CAF50; color:white; flex:1; border:none; border-radius:4px; font-weight:bold; padding:10px;" disabled>形を決定（次へ）</button>
          </div>
        </div>
        
        <div id="drawStep2" style="display:none;">
          <div id="addressHint" style="display:none; background:#222; padding:8px; border-radius:4px; margin-bottom:10px; line-height:1.4;"></div>
          <input type="text" id="fieldName" class="form-input" placeholder="圃場名">
          <select id="fieldLocation" class="form-input"><option value="">拠点</option></select>
          <select id="fieldCondition" class="form-input"><option value="">条件</option></select>
          <select id="fieldStatus" class="form-input"><option value="">稼働状況</option></select>
          
          <div style="display:flex; gap:8px;">
            <button id="backToStep1Btn" style="background:#666; color:white; flex:1; border:none; border-radius:4px; font-weight:bold; padding:10px;">やり直す</button>
            <button id="finalSaveBtn" style="background:#d32f2f; color:white; flex:1; border:none; border-radius:4px; font-weight:bold; padding:10px;">圃場登録</button>
          </div>
        </div>
      </div>
    </div> <div id="editShapePanel" style="display:none; background:#ffeb3b; color:#000; padding:10px; font-weight:bold; text-align:center;">⚠️ 形状変更中 <button id="saveShapeBtn" style="background:#d32f2f; color:white; margin:0 10px;">確定</button><button id="cancelShapeBtn" style="background:#666; color:#fff;">戻す</button></div>
    <div id="mergeModePanel" style="display:none; background:#FF9800; color:#fff; padding:10px; font-weight:bold; text-align:center; z-index:10;">🚜 統合モード中：もう一つの圃場をクリックして統合 <button onclick="cancelMerge()" style="background:#666; color:#fff; border:none; padding:6px 15px; border-radius:4px; margin-left:15px; font-weight:bold; cursor:pointer;">キャンセル</button></div>    
    <div id="map"></div>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
    
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCjTdBJUXSQOk3fxGk0ESoKErCwdPg0MQ8&libraries=drawing,geometry,places&language=ja&v=weekly"></script>
   
    <script src="admin.js"></script>
    <script src="cad.js"></script>
  </body>
</html>
