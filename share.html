<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>情熱MAPで開く</title>
  <style>
    body { font-family: sans-serif; background: #f8f9fa; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); text-align: center; width: 80%; max-width: 300px; }
    button { width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; color: white; }
    .btn-admin { background: #d32f2f; }
    .btn-worker { background: #2196F3; }
  </style>
</head>
<body>
  <div class="box">
    <h3 style="margin-top:0;">情熱MAPで開く</h3>
    <p style="font-size:12px; color:#666;">受け取った場所をどちらのモードで開きますか？</p>
    
    <button class="btn-admin" onclick="openMap('admin')">管理者 (Admin) で開く</button>
    <button class="btn-worker" onclick="openMap('worker')">作業者 (Worker) で開く</button>
  </div>

  <script>
    function openMap(mode) {
      // 受け取ったURLパラメータ（共有されたGoogleマップのURLなど）をそのまま引き継ぐ
      const currentParams = window.location.search;
      
      if (mode === 'admin') {
        window.location.href = '/admin.html' + currentParams;
      } else {
        window.location.href = '/worker.html' + currentParams; // ※worker側のファイル名に合わせてください
      }
    }
  </script>
</body>
</html>
