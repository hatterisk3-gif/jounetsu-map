<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>情熱MAP [鶏糞散布用] v1.01</title>
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" href="icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="stylesheet" href="map.css">
</head>
<body>
    <div id="loginScreen">
        <div class="login-box">
            <h2 style="color:#795548;">鶏糞散布MAP (v1.01)</h2>
            <div id="loginError" style="color:red; margin-bottom:10px;"></div>
            <input type="text" id="loginId" class="login-input" placeholder="スタッフID">
            <input type="password" id="loginPw" class="login-input" placeholder="パスワード">
            <button class="login-btn" onclick="executeLogin()">ログイン</button>
        </div>
    </div>

    <!-- GPS Button -->
    <button id="btnCurrentLocation" onclick="moveToCurrentLocation()"
        style="position: fixed; bottom: 20px; right: 10px; width: 50px; height: 50px; background: white; color: #4285F4; border: none; border-radius: 50%; font-weight: bold; font-size: 24px; box-shadow: 0 3px 8px rgba(0,0,0,0.3); z-index: 2000; display: flex; justify-content: center; align-items: center; cursor: pointer; padding: 0; transition: all 0.3s ease;">
        📍
    </button>

    <div class="control-panel">
        <div class="control-row">
            <button onclick="location.reload()" class="ctrl-btn" style="background:#fff; color:#333; border:1px solid #ccc;">🔄 更新</button>
            <button onclick="openHistoryModal()" class="ctrl-btn" style="background:#E3F2FD; color:#1A73E8; border:1px solid #1A73E8;">📋 登録履歴</button>
            <button onclick="openWeatherModal()" class="ctrl-btn" style="background:#fff; color:#ff9800; border:1px solid #ff9800;">☁️ 天気</button>
            <button onclick="openTyphoonModal()" class="ctrl-btn" style="background:#ffebee; color:#d32f2f; border:1px solid #d32f2f;">🌀 台風</button>
            <button onclick="openContactModal()" class="ctrl-btn" style="background:#E8F5E9; color:#388E3C; border:1px solid #388E3C;">📞 連絡先</button>
            <button onclick="executeLogout()" class="ctrl-btn" style="background:#F44336; color:white; border:none;">ログアウト</button>
        </div>
    </div>

    <div id="map"></div>

    <!-- 汎用モーダル -->
    <div id="modal">
        <div class="modal-content" id="modalBody"></div>
    </div>

    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCjTdBJUXSQOk3fxGk0ESoKErCwdPg0MQ8&libraries=geometry"></script>
    <script src="map.js"></script>
</body>
</html>
